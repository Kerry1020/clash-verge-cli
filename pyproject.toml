[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-verge-cli"
dynamic = ["version"]
description = "Command line interface for the Clash Verge (Rev) / mihomo VPN client"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0" }
authors = [{ name = "Kerry1020", email = "likerry22@gmail.com" }]
keywords = ["clash", "clash-verge", "mihomo", "proxy", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "click>=8.0.0,<9.0.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.28.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/Kerry1020/clash-verge-cli"
Issues = "https://github.com/Kerry1020/clash-verge-cli/issues"
Changelog = "https://github.com/Kerry1020/clash-verge-cli/blob/main/CHANGELOG.md"

[project.scripts]
clash-verge = "clash_verge_cli.commands:main"

[tool.setuptools.dynamic]
version = { attr = "clash_verge_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py38"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "UP032",  # keep str.format for readability
    "S101",   # assert in tests
    "S603", "S607",  # subprocess calls are intentional (pkill/open/explorer)
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
